name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.26.11'
      - name: Test and package for Apple Silicon
        env:
          TAG: ${{ github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          make test
          make package VERSION="${TAG#v}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: |
            build/release/*.tar.gz
            build/release/*.zip
            build/release/*.zip.sha256
            build/release/SHA256SUMS
          if-no-files-found: error
          compression-level: 0

  publish:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: ${{ runner.temp }}/release
      - name: Publish the tagged release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag_commit=$(git rev-parse "refs/tags/$TAG^{commit}")
          test "$tag_commit" = "$(git rev-parse "$GITHUB_SHA^{commit}")"
          git merge-base --is-ancestor "$tag_commit" HEAD

          archive="mi-guard-${TAG#v}-darwin-arm64.tar.gz"
          app_zip="mi-guard-app-${TAG#v}-darwin-arm64.zip"
          (cd "$RUNNER_TEMP/release" && sha256sum "$archive" | cmp - SHA256SUMS)
          (cd "$RUNNER_TEMP/release" && sha256sum "$app_zip" | cmp - "$app_zip.sha256")
          if ! draft=$(gh release view "$TAG" --json isDraft --jq .isDraft); then
            gh release create "$TAG" --verify-tag --draft --title "mi-guard $TAG" --notes-from-tag
            draft=true
          fi
          if [[ "$draft" == true ]]; then
            gh release upload "$TAG" "$RUNNER_TEMP/release/$archive" "$RUNNER_TEMP/release/SHA256SUMS" \
              "$RUNNER_TEMP/release/$app_zip" "$RUNNER_TEMP/release/$app_zip.sha256" --clobber
            gh release edit "$TAG" --draft=false
          fi

          # A retry uses the public asset, even if the new build has different bytes.
          gh release download "$TAG" --pattern "$archive" --pattern SHA256SUMS \
            --pattern "$app_zip" --pattern "$app_zip.sha256" --dir "$RUNNER_TEMP/published"
          cd "$RUNNER_TEMP/published"
          sha256sum "$archive" | cmp - SHA256SUMS
          sha256sum "$app_zip" | cmp - "$app_zip.sha256"
      - name: Update the stable Homebrew formula and cask
        run: |
          git pull --ff-only origin "$DEFAULT_BRANCH"
          digest=$(cut -d ' ' -f 1 "$RUNNER_TEMP/published/SHA256SUMS")
          app_digest=$(cut -d ' ' -f 1 "$RUNNER_TEMP/published/mi-guard-app-${TAG#v}-darwin-arm64.zip.sha256")
          python3 deploy/homebrew/update_formula.py "${TAG#v}" "$digest" "$app_digest"
          if ! git diff --quiet -- Formula/mi-guard.rb Casks/mi-guard-app.rb; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add Formula/mi-guard.rb Casks/mi-guard-app.rb
            git commit -m "Update Homebrew to $TAG"
            git push origin "HEAD:refs/heads/$DEFAULT_BRANCH"
          fi

  verify-install:
    needs: publish
    runs-on: macos-15
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      TAG: ${{ github.ref_name }}
    steps:
      - name: Install the published package through the public tap
        run: |
          formula=lonelygo/mi-guard/mi-guard
          brew tap lonelygo/mi-guard https://github.com/lonelygo/mi-guard.git
          brew install "$formula"
          prefix=$(brew --prefix "$formula")
          test "$(basename "$(cd "$prefix" && pwd -P)")" = "${TAG#v}"
          brew test "$formula"
          brew services info "$formula"
      - name: Install the dashboard from the public cask
        run: |
          brew install --cask lonelygo/mi-guard/mi-guard-app
          app=/Applications/mi-guard.app
          test "$(plutil -extract CFBundleShortVersionString raw -o - "$app/Contents/Info.plist")" = "${TAG#v}"
          test "$("$app/Contents/Helpers/mihomo-guard" --version)" = "mihomo-guard ${TAG#v}"
          codesign --verify --deep --strict "$app"
