# mihomo-guard-default.yaml — 默认配置、选项说明和地区组示例
#
# 首次运行 mihomo-guard init 会创建 ~/.config/mihomo-guard/mihomo-guard.yaml。
# 将 config_path 和组名替换为自己的配置，使用 bench --source 时再填写 stable_binary。
# 每次升级后，可用本文件对照新增选项。
# 所有子命令均可用 -c path_to_your_guard_config.yaml 或 --config 指定另一份 guard 配置。
# 文件路径支持 ~/，相对路径以正在使用的 guard 配置所在目录为基准。

mihomo:
  controller: http://127.0.0.1:9090 # 在线内核的外部控制器。使用带端口的回环 HTTP(S) 地址。
  secret: ""                       # 留空时从 config_path 所指文件读取控制器的 secret。
  config_path: path_to_your_config.yaml # 正在使用的 Mihomo 主配置，供读取接线与 secret。
  # 仅 bench --source 需要这个可执行文件，以启动测试新订阅的临时内核。
  stable_binary: path_to_your_mihomo_core
  allow_prerelease: false           # 默认要求临时内核报告正式版本。true 允许测试预发布内核。
  test_group: mi-guard-bench        # 测速专用的可写 select 组，与 Mihomo 配置中的名称一致。
  test_proxy: http://127.0.0.1:17987 # 绑定 test_group 的专用回环监听。支持 http、socks5、socks5h，须带端口。

# 时长可写 500ms、30s、1m30s 或 12h。一天写作 24h。
schedule:
  heartbeat_interval: 30s    # 链路存活检查周期，须大于 0。
  heartbeat_timeout: 3s      # 一次延迟或心跳探测的超时，须大于 0。
  heartbeat_failures: 2      # 连续失败几次进入恢复，至少 1 次。地区复查的失败阈值至少为 2 次。
  full_interval: 12h         # 所有纳管组完整测速的周期，须大于 0。
  active_interval: 2h        # 在用节点的带宽快筛周期。0s 关闭快筛。
  recheck_delay: 1m          # 连续降速复测之间的间隔，须大于 0。
  cooldown: 5m               # 切换后的冷静期，约束性能和地区切换。0s 关闭，硬断线可直接恢复。
  geo_interval: 5m           # 已启用地区校验的组多久复查一次，须大于 0。

# 探测 URL 使用绝对 HTTP(S) 地址。带宽以 Mbps 表示，下载额度以字节表示。
speedtest:
  url: https://speed.cloudflare.com/__down             # 用于带宽测量的下载地址。
  liveness_url: https://www.gstatic.com/generate_204    # 用于节点延迟、心跳和切换后验证。
  geo_url: https://www.google.com/searchdomaincheck?format=domain # 返回出口对应的域名文本。
  trace_url: https://www.cloudflare.com/cdn-cgi/trace   # 补充记录 IP、colo 和 loc。空字符串可关闭。
  timeout: 8s                 # 下载、地区检查及监听入口核验的超时，须大于 0。
  streams_per_node: 1         # 每节点 1 到 8 条下载流，共享该节点本次测速的总额度。
  sweep_bytes: 4194304        # 4 MiB。完整扫描和手动 bench 每节点的响应体上限。
  quick_bytes: 1048576        # 1 MiB。在用节点一次快筛的响应体上限。
  confirm_bytes: 8388608      # 8 MiB。降速确认时每个复测节点的响应体上限。
  monthly_bytes: 6442450944   # 6 GiB。同一 history.file 下，daemon、bench 和 --source 共用的账期预算。
  billing_day: 1              # 每月本地日期的第 1 到 28 日。首次建立账本前设定，已有账本会校验起始日。
# 四个字节额度均须大于 0。正常结算按实际读取的下载响应体计费，进程意外退出时预留量仍占预算。
# 机场的流量倍率、协议开销需另计。bench --bytes 和 --streams 可以只覆盖当次手动测速。

selection:
  severe_drop_pct: 20         # 降速确认门槛（大于 0、小于 100）。默认当前速度降至历史正常中位数的 80% 即复测。
  near_best_pct: 20           # 与本轮最快节点的容差（0 到 100）。默认达到本轮最快速度的 80% 即进入同一优先档。
  slow_confirmations: 2       # 至少 2 次，包含初次观察到的降速。
  sync_direct_on_warp_switch: true # 链式前置切换成功后，尽力让其 direct 组选中同名节点。
  max_sample_age: 36h         # 选取复测备选时可复用的历史带宽样本年龄上限，须大于 0。

history:
  file: speed-history.json    # 保存测速历史、已用流量和预留量。默认与当前 guard 配置同目录。
  samples_per_node: 50       # 每个 provider 和节点名组合保留的最近带宽样本数，至少 1 条。

notifications:
  enabled: true              # macOS 通知总开关。
  summary: true              # 全组扫描结束后发送一条摘要。
  switch: true               # 发送实际换线结果。
  helper: auto               # 自动找到安装包、源码构建或用户 Applications 下的助手，也可指定 .app 或可执行文件路径。

# 省略 groups 会使用下面两个默认链式示例。显式提供 groups 会替换整个列表。
# 要保留这两项，可在它们后面追加其他链或手动选择组。daemon 至少需要一项。
# 仅手动指定组、节点或来源测速时可写 groups: []。
#
# name 必须是 Mihomo 中可写 select 组的完整名称，包括 emoji、空格和标点。
# chain 模式用 name 选择链式前置，要求填写不同名的 chain，可选择性地添加跟随组 direct。
# 下例中，Mihomo 链节点 dialer-proxy-1 通过 dialer-proxy: primary-group-1 使用前置组。
# selector 模式直接管理 name，省略 chain 和 direct。可应用的节点须直接属于 name，也须在 test_group 中。
# 各组的 name、chain、direct 和专用测速组的名称应各自唯一。将跟随组改为独立管理时，先移除原 direct 引用。
# geo_proxy 和 expected_geo 成对设置。两者都留空时跳过地区检查。
# 设置 geo_proxy 时，其监听在 chain 模式绑定 chain，在 selector 模式绑定 name。
groups:
  - name: primary-group-1
    mode: chain                 # 省略 mode 也按 chain 处理，兼容 v0.1.0 配置。
    chain: dialer-proxy-1       # 选线后验证此链节点的实际路径。
    direct: direct-group-1      # 可选的跟随组，留空即只切前置。该组跟随失败时保留健康前置。
    geo_proxy: http://127.0.0.1:7898 # 用于地区检查的回环 HTTP/SOCKS 监听地址，须带端口。
    expected_geo: .google.com   # 与 geo_url 返回的文本去除首尾空白后的值精确比较。
    strict_geo: false           # false 时可回退到首个链路可用候选。true 要求该候选同时通过地区校验。
    exclude_regex: ""          # 按生效节点名排除候选，使用 Go 正则。留空即保留所有合格成员。
    min_mbps: 0                # 绝对带宽下限，单位 Mbps。0 关闭。可用于无历史时发现降速、筛除低于下限的已测候选。
  - name: primary-group-2
    mode: chain
    chain: dialer-proxy-2       # Mihomo 中设置 dialer-proxy: primary-group-2。
    direct: direct-group-2
    geo_proxy: ""              # 第二组默认跳过地区检查。
    expected_geo: ""
    strict_geo: false
    exclude_regex: ""
    min_mbps: 0

  # 增加第三条链式前置时，把名称换成实际对象名并取消以下条目的注释。
  # - name: primary-group-3
  #   mode: chain
  #   chain: dialer-proxy-3
  #   direct: direct-group-3

  # 只切一个额外手动组时，在同一个 groups 列表中追加以下两行。
  # - name: optional-selector-group
  #   mode: selector
