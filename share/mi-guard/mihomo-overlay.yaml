# 将以下条目手动并入当前 Mihomo 配置的 proxy-groups 和 listeners 列表，
# 保留原有条目，再在所用客户端中重新加载配置。
# 若客户端从订阅生成主配置，请在该客户端的持久覆写配置中维护这些条目。
# 将 provider 和链节点的示例名替换为实际名称。监听使用的组名须与 guard 配置一致。

proxy-groups:
  - name: mi-guard-bench
    type: select
    hidden: true
    # 换成实际加载的 provider 名。此测速组仅供下方专用监听使用。
    use:
      - proxy-providers-1
      - proxy-providers-2

listeners:
  - name: mi-guard-bench-in
    type: mixed
    listen: 127.0.0.1
    port: 17987
    proxy: mi-guard-bench
  # 仅启用地区校验时合并此项。监听地址、端口与 guard 组的 geo_proxy 对齐。
  # chain 模式绑定链节点 chain，selector 模式绑定手动组 name。
  - name: mi-guard-geo-in
    type: mixed
    listen: 127.0.0.1
    port: 7898
    proxy: dialer-proxy-1
